# GitHub Pages serves metadata.stormberry.as from this repository root.
#
# Without this file Jekyll publishes the WHOLE repository, so the tooling scripts, the
# README and the licence were all reachable from the live site. Nothing here was secret,
# these repos are public, but source and tooling have no business being served next to
# the product.
#
# Same rules as the estate-wide sweep of 2026-09-05, which followed finding
# scheduler.stormberry.as/index.dev.html live, a second working rendering of that app.
#
# Jekyll's `exclude` REPLACES its defaults rather than adding to them, which is why
# node_modules/ and package files are listed even though nothing installs them: the
# shipped app has no dependencies, and the test runner is Node's own.
#
# disclaimer.html and privacy.html are deliberately NOT excluded: they are the published
# pages the footer links to.
#
# DISCLAIMER.md is excluded (6 November 2026). It is the Markdown source of disclaimer.html.
# The first-run notice (gate.js) and the footer link disclaimer.html, and no served file
# links DISCLAIMER.md. The Android build reads this list too, so the APK leaves it out as well.
#
# src/ is NOT excluded: app.js imports the scrubbing engine from it at runtime.
#
# android/, fastlane/ and zapstore.yaml are the Android app's build and store files. The
# app bundles the web files from this root at build time; nothing in those folders is
# part of the website. (.github/ needs no entry: Jekyll never publishes dot folders.)
#
# package.json, package-lock.json, ts/, tools/, tsconfig.json and tsconfig.core.json are
# the TypeScript build (2026-11-01): ts/ holds the sources that tools/build-ts.sh compiles
# into the .js files served from this root, which are committed because Pages has no
# build step. The site and the app load only the compiled .js. (.npmrc and .gitattributes
# need no entry: Jekyll never publishes dot files.) jsconfig.json and types/, the checker
# of the JavaScript that was still hand-written, were deleted on 2026-11-05 when the last
# file had moved to TypeScript.
#
# CHANGELOG.md is the Android app's release log (1.1.1), read on GitHub, not part of the
# website or the app.
#
# GitHub Pages builds with its default theme (jekyll-theme-primer) unless this file names
# none, and that theme adds /assets/css/style.css: a stylesheet no page links, in fonts that
# are not Inter. theme: null turns the theme off (6 November 2026). Tested with the Pages
# build image (github-pages 232): the only change to the site is that this file is gone.
theme: null

exclude:
  - DISCLAIMER.md
  - LICENSE
  - NOTICE
  - README.md
  - CHANGELOG.md
  - bump_assets.py
  - tests/
  - package.json
  - package-lock.json
  - node_modules/
  - android/
  - fastlane/
  - zapstore.yaml
  - ts/
  - tools/
  - tsconfig.json
  - tsconfig.core.json
