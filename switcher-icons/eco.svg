<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Compass ring -->
  <circle cx="32" cy="32" r="24" stroke="url(#ringGrad)" stroke-width="3.5" fill="none"/>
  <!-- Tick marks at the cardinal and intercardinal points -->
  <g stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="4"  x2="32" y2="10"/>
    <line x1="32" y1="54" x2="32" y2="60"/>
    <line x1="4"  y1="32" x2="10" y2="32"/>
    <line x1="54" y1="32" x2="60" y2="32"/>
  </g>
  <g stroke="url(#ringGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.65">
    <line x1="12.2" y1="12.2" x2="16.5" y2="16.5"/>
    <line x1="47.5" y1="47.5" x2="51.8" y2="51.8"/>
    <line x1="51.8" y1="12.2" x2="47.5" y2="16.5"/>
    <line x1="16.5" y1="47.5" x2="12.2" y2="51.8"/>
  </g>
  <!-- Leaf-shaped needle pointing north-east -->
  <path d="M32 32 C 34 24, 39 18, 46 15 C 45 23, 41 30, 34 34 Z" fill="url(#leafGrad)"/>
  <path d="M32 32 C 30 40, 25 46, 18 49 C 19 41, 23 34, 30 30 Z" fill="url(#leafGrad)" opacity="0.45"/>
  <!-- Needle midrib -->
  <line x1="34" y1="30" x2="43" y2="18" stroke="#eafff0" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Pivot -->
  <circle cx="32" cy="32" r="3" fill="url(#sunGrad)"/>
  <!-- Small sun accent, upper left -->
  <circle cx="13" cy="12" r="4.5" fill="url(#sunGrad)"/>
  <g stroke="url(#sunGrad)" stroke-width="1.6" stroke-linecap="round">
    <line x1="13" y1="3.5" x2="13" y2="5.8"/>
    <line x1="13" y1="18.2" x2="13" y2="20.5"/>
    <line x1="4.5" y1="12" x2="6.8" y2="12"/>
    <line x1="19.2" y1="12" x2="21.5" y2="12"/>
  </g>
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#3fa34d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3fa34d"/>
      <stop offset="100%" stop-color="#7ed957"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
  </defs>
</svg>
