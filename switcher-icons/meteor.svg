<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tail" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#82aaff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" fill="transparent"/>
  
  <!-- Shooting Star Group -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="100,-100; -50,50" dur="3s" repeatCount="indefinite" />
    <path d="M50 50 L80 20 L55 55 Z" fill="url(#tail)"/>
    <circle cx="50" cy="50" r="4" fill="#ffffff" />
  </g>
</svg>
